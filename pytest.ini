[pytest]
# ============================================================================
# KIS E2E 테스트 설정
# ============================================================================

# 테스트 마커 정의
markers =
    kis_smoke: KIS API 스모크 테스트 (RUN_KIS_SMOKE=true 필요)
    e2e: End-to-End 통합 테스트
    slow: 느린 테스트 (Rate Limit 포함)

# 기본 테스트 옵션
addopts =
    -v
    --tb=short
    --strict-markers

# 테스트 파일 패턴
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 테스트 디렉토리
testpaths = tests

# 로깅 설정
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# 경고 필터
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# ============================================================================
# 테스트 실행 가이드
# ============================================================================
#
# 1. 단위 테스트만 실행 (KIS API 호출 없음):
#    pytest tests/ -m "not kis_smoke"
#
# 2. E2E 테스트 실행 (KIS 모의투자 API 호출):
#    RUN_KIS_SMOKE=true pytest tests/test_kis_e2e.py -v
#
# 3. 특정 테스트 클래스만 실행:
#    RUN_KIS_SMOKE=true pytest tests/test_kis_e2e.py::TestKISE2EOrderFlow -v
#
# 4. 느린 테스트 제외:
#    RUN_KIS_SMOKE=true pytest tests/test_kis_e2e.py -m "not slow" -v
#
# 5. 전체 테스트 (단위 + E2E):
#    RUN_KIS_SMOKE=true pytest tests/ -v
#
# ============================================================================
